<title id="title">TechnicalNexus — implemented Advance 1 architecture</title>
<desc id="desc">Spanish Streamlit UI, per-session state, application service, NLTK rules, reviewed repository and PostgreSQL. Original PDFs and explicit review manifests feed the database separately. No API, LLM or visual model is implemented.</desc>
