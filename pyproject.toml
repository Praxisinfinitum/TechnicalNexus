[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "technicalnexus"
version = "0.1.0"
description = "Equipment-scoped technical assistance with traceable sources"
requires-python = ">=3.12,<3.13"
dependencies = [
  "streamlit>=1.50,<2", "nltk>=3.9,<4", "pypdf>=6,<7",
  "sqlalchemy>=2.0,<3", "alembic>=1.16,<2", "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.1,<2", "cryptography>=46,<50", "fonttools>=4.60,<5"
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
technicalnexus = "technicalnexus.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/technicalnexus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a dedicated PostgreSQL test database"]
